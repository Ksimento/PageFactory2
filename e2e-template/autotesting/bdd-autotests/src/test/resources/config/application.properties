# Кастомные настройки для форка

# Имя блока реализующего всплывающий тост с сообщением (зелёный, жёлтый, красный)
TOAST_LIST_NAME = Список всплывающих уведомлений

# xpath прелоадера, по которому можно определить процесс загрузки данных
PRELOADER = //*[name() = 'svg' and (contains(@class, 'Spinner') or @data-qa = 'preloader')]

# название виджета, который описывает компонетнт экрана УПС и 404 (как он назвается в аннотации @ElementTitle в самой корневой странице платформы)
WIDGET_UPS_404_NAME = Виджет УПС 404

# xpath до тоста с сообщением об ошибке на экране логина
FAIL_LOGIN_TOAST = //div[contains(@class, 'alert_error')]



timeout = 20

tasks.to.kill = chrome

screenshot.strategy = driver

page.package = ru.sbt.sber_learning.pages

#url ??? ?????? ? api, ??????????? ??? ??????? ???????? ??????? ?????????? ??????????? ?????? url
#service.url = /tools/sbersova/graphql

#Показывать красную точку в месте, куда производится клик (для сафари может показывать неправильно). Включать только для отладки
webdriver.browser.display_click_point = false
webdriver.browser.name = Chrome

# Способ отслеживания загрузки страницы network - через отслеживания активных соединений, preloader - через экранный прелоадер
load.tracking.mode = network

# Включает режим отслеживания ошибок в JS консоли
js.console.error.tracking = true

fragments.enabled = true

#Настройка включает безопасный режим тестирования
#В случае падения бэка, тесты будут ждать 10 минут на восстановление
testing.safemode = false

#Настройка включает строгий режим тестирования
#В нестрогом режиме не проверяется отсутствие лишних пробелов в текстовых полях
testing.strictmode = false

#webdriver.chrome.capability.download.default_directory = /tmp/autotesting

webdriver.safari.capability.platformName = iOS
aspects.highlight.enabled = true

user.profile.set = predefined_data
#user.profile.set = stage
#user.profile.set = old_stands

selenoid.enableVNC = true
selenoid.sessionTimeout = 1m

# Smart smoke features generator
smart.smoke.path = src/test/resources/features/UI/smart_smoke
smart.smoke.path.prod = src/test/resources/features/UI/smart_smoke_prod