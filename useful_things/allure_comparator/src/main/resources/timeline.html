<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Распределение дефектов во времени</title>
    <style>
        a {
            position: absolute;
            display: block;
            height: 10px;
        }
        .passed {
            background-color: #94f3a9;
            border: 1px solid #41d863;
        }
        .passed:hover {
            background-color: #41d863;
        }
        .skipped {
            background-color: #7E807F;
            border: 1px solid #A3A3A3;
        }
        .skipped:hover {
            background-color: #505150;
        }
        .failed, .broken {
            background-color: #f067a6;
            border: 1px solid #a65b7e;
        }
        .failed:hover, .broken:hover {
            background-color: #a65b7e;
        }
        .wlb div {
            font-size: 0;
            color: #fff;
        }
        .ch {
            width: 100%;
            height: 3px;
            margin-top: 3px;
            border-radius: 10px;
            position: absolute;
        }
        .item {
            transition: all 0.3s;
        }
        .item:hover {
            transform: scale(1.2);
            z-index: 100;
        }
        .wlb div:hover {
            margin-left: -14px;
            margin-right: -15px;
            min-width: 30px;
            transform: scale(1.2) translateY(-20px);
            font-size: 12px;
        }
        .elb, .wlb {
            clear: both;
        }
        .elb div, .wlb div {
            float: left;
            height: 20px;
            text-align: center;
            font-family: monospace;
            padding-top: 5px;
        }
        .elb div {
            font-size: 12px;
        }
        .active {
            z-index: 1000;
            border: 2px solid #33f;
            margin-top: -2px;
        }
        .failPoint {
            position: absolute;
            width: 10px;
            height: 10px;
            margin-left: -5px;
        }
        .legend-point {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 10px;
            text-transform: capitalize;
        }
        .circle {
            border-radius: 5px;
        }
        .rhombus {
            transform: rotate(45deg);
        }
        label {
            display: block;
        }
        .table {
	        width: 100%;
	        border: none;
	        margin-bottom: 20px;
        }
        .table thead th {
	        font-weight: bold;
	        text-align: left;
	        border: none;
	        padding: 10px 15px;
	        background: #d8d8d8;
	        font-size: 14px;
        }
        .table {
             width: 100%;
             border-collapse: separate;
             border-spacing: 4px;
        }
         table thead tr {
             color: #ffffff;
             font-weight: bold;
         }
             table thead tr td {
             border-radius: 4px 4px 0 0;
             background: #2e82c3;
         }
         table tbody tr td {
             border: 1px solid #2e82c3;
             border-radius: 4px;
             background: #f0fff0;
         }
         table tbody tr td:hover {
             background: #a2c3dd;
             transition-duration: 0.2s;
         }
    </style>
</head>
<body>

</body>
</html>
